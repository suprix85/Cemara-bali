
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#064e3b">
<title>Admin CEMARA BALI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f0fdf4;color:#12372b}
header{background:#064e3b;color:white;padding:20px;text-align:center}
header h2{margin:0}
main{max-width:950px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;margin-bottom:18px;border-radius:12px;box-shadow:0 2px 9px #00000012}
h3{color:#065f46;margin-top:0}
label{display:block;margin-top:12px;font-weight:bold}
input,select,textarea{width:100%;padding:11px;margin-top:6px;border:1px solid #b7c9bf;border-radius:7px;font-size:15px}
button{background:#047857;color:white;border:0;padding:11px 15px;border-radius:7px;margin-top:12px;font-weight:bold;cursor:pointer}
button.secondary{background:#64748b}
button.danger{background:#b91c1c}
button.gold{background:#a16207}
button:disabled{opacity:.5}
.hidden{display:none!important}
.info{background:#ecfdf5;padding:12px;border-radius:7px;margin-top:10px}
.error{color:#b91c1c}
.success{color:#047857}
.item{border:1px solid #d1e5d8;padding:12px;border-radius:8px;margin-top:10px;overflow-wrap:anywhere}
.item img{max-width:120px;max-height:100px;object-fit:cover;border-radius:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.small{font-size:13px;color:#64748b}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.photo-grid .item img{width:100%;height:110px}
hr{border:0;border-top:1px solid #ddd;margin:18px 0}
</style>
</head>
<body>

<header>
<h2>🌲 ADMIN CEMARA BALI</h2>
<p>Cemara selalu dihati</p>
</header>

<main>

<!-- LOGIN -->
<section class="card" id="bagianLogin">
<h3>LOGIN PENGURUS</h3>
<label>Email</label>
<input type="email" id="emailLogin" placeholder="Email pengurus">
<label>Password</label>
<input type="password" id="passwordLogin" placeholder="Password">
<button onclick="masuk()" id="tombolLogin">MASUK</button>
<p id="pesanLogin"></p>
</section>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<div class="card">
<div class="row">
<div>
<h3>Dashboard Pengurus</h3>
<p id="infoAkun" class="small"></p>
</div>
<div style="text-align:right">
<button class="danger" onclick="keluar()">KELUAR</button>
</div>
</div>
</div>

<!-- ANGGOTA -->
<section class="card">
<h3>👥 DATA ANGGOTA CEMARA</h3>
<input id="cariAnggota" placeholder="Cari nama, nomor HP, atau nomor KTA" oninput="tampilkanAnggota()">
<button onclick="muatAnggota()">MUAT ULANG ANGGOTA</button>
<p id="pesanAnggota"></p>
<div id="daftarAnggota"></div>
</section>

<!-- LOGO -->
<section class="card">
<h3>🖼️ KELOLA LOGO</h3>
<label>Unggah Logo Baru</label>
<input type="file" id="fileLogo" accept="image/*">
<button onclick="unggahFile('logo')">UNGGAH LOGO</button>
<div id="daftarLogo"></div>
</section>

<!-- DOKUMEN -->
<section class="card">
<h3>📁 KELOLA DOKUMEN</h3>
<label>Unggah Dokumen</label>
<input type="file" id="fileDokumen">
<button onclick="unggahFile('dokumen')">UNGGAH DOKUMEN</button>
<div id="daftarDokumen"></div>
</section>

<!-- GALERI -->
<section class="card">
<h3>📸 KELOLA GALERI KEGIATAN CEMARA</h3>

<label>Kategori Galeri</label>
<select id="kategoriGaleri">
<option value="Sosial & Kemanusiaan">Sosial & Kemanusiaan</option>
<option value="Silaturahmi & Kebersamaan">Silaturahmi & Kebersamaan</option>
<option value="Camping & Rekreasi">Camping & Rekreasi</option>
<option value="Keagamaan">Keagamaan</option>
<option value="HUT CEMARA & Perayaan">HUT CEMARA & Perayaan</option>
</select>

<label>Nama Album</label>
<input type="text" id="judulGaleri" placeholder="Contoh: Camping CEMARA 2026">

<label>Tanggal Kegiatan</label>
<input type="date" id="tanggalGaleri">

<label>Deskripsi Kegiatan</label>
<textarea id="deskripsiGaleri" rows="3" placeholder="Keterangan kegiatan (boleh dikosongkan)"></textarea>

<button onclick="buatAlbum()">BUAT ALBUM</button>
<p id="pesanBuatAlbum"></p>

<hr>

<h3>UNGGAH FOTO KE ALBUM</h3>
<label>Pilih Album</label>
<select id="albumGaleri">
<option value="">Pilih album terlebih dahulu</option>
</select>

<label>Pilih Banyak Foto dari HP</label>
<input type="file" id="fotoGaleri" accept="image/*" multiple>
<p class="small">Maksimal ukuran setiap foto 5 MB.</p>
<button onclick="unggahGaleri()">UNGGAH FOTO GALERI</button>
<p id="pesanGaleri"></p>

<hr>

<h3>DAFTAR ALBUM DAN FOTO</h3>
<button class="secondary" onclick="muatGaleriAdmin()">MUAT ULANG GALERI</button>
<div id="daftarGaleriAdmin"></div>
</section>

<footer style="text-align:center;padding:20px;color:#64748b">
Dibuat oleh Selamet Supriono
</footer>
</div>
</main>

<script>
const URL_SUPABASE="https://epyxdvxgcgxgsvrkpsid.supabase.co";
const KEY_SUPABASE="sb_publishable_BrT9hySkfHZwBhCtYRRyUw_VZqpa1U9";
const db=window.supabase.createClient(URL_SUPABASE,KEY_SUPABASE);
const BUCKET="cemara-bali";

let dataAnggota=[];
let dataAlbum=[];
let dataFoto=[];

function aman(teks){
return String(teks??"").replace(/[&<>"']/g,function(m){
return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m];
});
}

function pesan(id,teks,jenis=""){
const el=document.getElementById(id);
if(el){el.className=jenis;el.textContent=teks;}
}

async function masuk(){
const email=document.getElementById("emailLogin").value.trim();
const password=document.getElementById("passwordLogin").value;
pesan("pesanLogin","Memeriksa login...");
const {data,error}=await db.auth.signInWithPassword({email,password});
if(error){pesan("pesanLogin","Login gagal: "+error.message,"error");return;}
tampilkanDashboard(data.user);
}

async function periksaLogin(){
const {data,error}=await db.auth.getSession();
if(error){console.error(error);return;}
if(data.session){
tampilkanDashboard(data.session.user);
}
}

async function tampilkanDashboard(user){
document.getElementById("bagianLogin").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
document.getElementById("infoAkun").textContent="Login sebagai: "+user.email;
await muatAnggota();
await muatFile("logo");
await muatFile("dokumen");
await muatPilihanAlbum();
await muatGaleriAdmin();
}

async function keluar(){
await db.auth.signOut();
location.reload();
}

/* =========================
   DATA ANGGOTA
========================= */

async function muatAnggota(){
pesan("pesanAnggota","Memuat data anggota...");
const {data,error}=await db
.from("Anggota_Cemara")
.select("*")
.order("Created_at",{ascending:false});

if(error){
pesan("pesanAnggota","Gagal memuat anggota: "+error.message,"error");
return;
}
dataAnggota=data||[];
pesan("pesanAnggota","Jumlah data: "+dataAnggota.length,"success");
tampilkanAnggota();
}

function tampilkanAnggota(){
const cari=document.getElementById("cariAnggota").value.toLowerCase();
const hasil=dataAnggota.filter(a=>
String(a.Nama_lengkap||"").toLowerCase().includes(cari)||
String(a.Nomor_hp||"").toLowerCase().includes(cari)||
String(a.Nomor_kta||"").toLowerCase().includes(cari)
);

const tempat=document.getElementById("daftarAnggota");
if(!hasil.length){
tempat.innerHTML="<p>Data anggota tidak ditemukan.</p>";
return;
}

tempat.innerHTML=hasil.map(a=>`
<div class="item">
<b>${aman(a.Nama_lengkap)}</b>
<p class="small">No. KTA: ${aman(a.Nomor_kta)}</p>
<p>HP: ${aman(a.Nomor_hp)}</p>
<p>Alamat: ${aman(a.Alamat)}</p>
<p>Status: ${aman(a.Status)}</p>
<button onclick="bukaEdit('${a.id}')">EDIT DATA</button>
</div>
`).join("");
}

async function bukaEdit(id){
const a=dataAnggota.find(x=>x.id===id);
if(!a)return;

const nama=prompt("Nama lengkap:",a.Nama_lengkap||"");
if(nama===null)return;
const hp=prompt("Nomor HP:",a.Nomor_hp||"");
if(hp===null)return;
const alamat=prompt("Alamat:",a.Alamat||"");
if(alamat===null)return;
const kta=prompt("Nomor KTA:",a.Nomor_kta||"");
if(kta===null)return;
const status=prompt("Status anggota:",a.Status||"Aktif");
if(status===null)return;

const {error}=await db.from("Anggota_Cemara").update({
Nama_lengkap:nama,
Nomor_hp:hp,
Alamat:alamat,
Nomor_kta:kta,
Status:status
}).eq("id",id);

if(error){alert("Gagal menyimpan: "+error.message);return;}
alert("Data anggota berhasil diperbarui.");
await muatAnggota();
}

/* =========================
   LOGO DAN DOKUMEN
========================= */

async function unggahFile(folder){
const input=document.getElementById(folder==="logo"?"fileLogo":"fileDokumen");
const file=input.files[0];
if(!file){alert("Pilih file terlebih dahulu.");return;}

const nama=Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
const path=folder+"/"+nama;

const {error}=await db.storage.from(BUCKET).upload(path,file,{upsert:false});
if(error){alert("Upload gagal: "+error.message);return;}

alert("File berhasil diunggah.");
input.value="";
await muatFile(folder);
}

async function muatFile(folder){
const target=document.getElementById(folder==="logo"?"daftarLogo":"daftarDokumen");
if(!target)return;

const {data,error}=await db.storage.from(BUCKET).list(folder,{limit:100});
if(error){
target.innerHTML="<p class='error'>Gagal memuat file: "+aman(error.message)+"</p>";
return;
}

if(!data||!data.length){
target.innerHTML="<p class='small'>Belum ada file.</p>";
return;
}

target.innerHTML=data.filter(f=>f.name!=="").map(f=>{
const path=folder+"/"+f.name;
const url=db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
return `<div class="item">
${folder==="logo"?`<img src="${url}" alt="Logo">`:""}
<p>${aman(f.name)}</p>
<a href="${url}" target="_blank">LIHAT / BUKA FILE</a>
<br>
<button class="danger" onclick="hapusFile('${aman(path)}','${folder}')">HAPUS</button>
</div>`;
}).join("");
}

async function hapusFile(path,folder){
if(!confirm("Yakin ingin menghapus file ini?"))return;
const {error}=await db.storage.from(BUCKET).remove([path]);
if(error){alert("Gagal menghapus: "+error.message);return;}
alert("File berhasil dihapus.");
await muatFile(folder);
}

/* =========================
   KELOLA ALBUM GALERI
========================= */

async function buatAlbum(){
const nama=document.getElementById("judulGaleri").value.trim();
const kategori=document.getElementById("kategoriGaleri").value;
const tanggal=document.getElementById("tanggalGaleri").value||null;
const deskripsi=document.getElementById("deskripsiGaleri").value.trim();

if(!nama){alert("Isi nama album terlebih dahulu.");return;}

const id="album-"+Date.now()+"-"+Math.random().toString(36).slice(2,7);

const {error}=await db.from("Album_Galeri_Cemara").insert([{
id:id,
nama_album:nama,
kategori:kategori,
tanggal_kegiatan:tanggal,
deskripsi:deskripsi
}]);

if(error){
pesan("pesanBuatAlbum","Gagal membuat album: "+error.message,"error");
return;
}

document.getElementById("judulGaleri").value="";
document.getElementById("tanggalGaleri").value="";
document.getElementById("deskripsiGaleri").value="";
pesan("pesanBuatAlbum","Album berhasil dibuat.","success");

await muatPilihanAlbum();
await muatGaleriAdmin();
}

async function muatPilihanAlbum(){
const select=document.getElementById("albumGaleri");
const {data,error}=await db.from("Album_Galeri_Cemara")
.select("*").order("nama_album",{ascending:true});

if(error){
select.innerHTML='<option value="">Gagal memuat album</option>';
pesan("pesanGaleri","Gagal memuat album: "+error.message,"error");
return;
}

dataAlbum=data||[];
select.innerHTML='<option value="">Pilih album terlebih dahulu</option>'+
dataAlbum.map(a=>`<option value="${aman(a.id)}">${aman(a.nama_album)} — ${aman(a.kategori)}</option>`).join("");
}

/* =========================
   UNGGAH FOTO GALERI
========================= */

async function unggahGaleri(){
const albumId=document.getElementById("albumGaleri").value;
const input=document.getElementById("fotoGaleri");
const files=Array.from(input.files||[]);

if(!albumId){alert("Pilih album terlebih dahulu.");return;}
if(!files.length){alert("Pilih foto terlebih dahulu.");return;}

const album=dataAlbum.find(a=>a.id===albumId);
if(!album){alert("Album tidak ditemukan. Muat ulang album.");return;}

pesan("pesanGaleri","Menyiapkan unggahan "+files.length+" foto...");

let berhasil=0;
let gagal=0;

for(let i=0;i<files.length;i++){
const file=files[i];

if(!file.type.startsWith("image/")||file.size>5*1024*1024){
gagal++;
continue;
}

const nama=Date.now()+"-"+i+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
const path="galeri/"+nama;

const upload=await db.storage.from(BUCKET).upload(path,file,{upsert:false});
if(upload.error){gagal++;continue;}

const simpan=await db.from("Galeri_Cemara").insert([{
judul:album.nama_album,
kategori:album.kategori,
tanggal_kegiatan:album.tanggal_kegiatan,
deskripsi:album.deskripsi,
foto_path:path,
album_id:album.id
}]);

if(simpan.error){
await db.storage.from(BUCKET).remove([path]);
gagal++;
}else{
berhasil++;
}

pesan("pesanGaleri","Proses: "+(i+1)+"/"+files.length+" foto");
}

input.value="";
pesan("pesanGaleri","Selesai. Berhasil: "+berhasil+" foto. Gagal/dilewati: "+gagal+" foto.",gagal?"error":"success");
await muatGaleriAdmin();
}

/* =========================
   TAMPILKAN ALBUM DAN FOTO
========================= */

async function muatGaleriAdmin(){
const tempat=document.getElementById("daftarGaleriAdmin");
tempat.innerHTML="<p>Memuat album dan foto...</p>";

const hasilAlbum=await db.from("Album_Galeri_Cemara")
.select("*").order("nama_album",{ascending:true});

if(hasilAlbum.error){
tempat.innerHTML="<p class='error'>Gagal memuat album: "+aman(hasilAlbum.error.message)+"</p>";
return;
}

const hasilFoto=await db.from("Galeri_Cemara")
.select("*").order("created_at",{ascending:false});

if(hasilFoto.error){
tempat.innerHTML="<p class='error'>Gagal memuat foto: "+aman(hasilFoto.error.message)+"</p>";
return;
}

dataAlbum=hasilAlbum.data||[];
dataFoto=hasilFoto.data||[];

if(!dataAlbum.length){
tempat.innerHTML="<p>Belum ada album galeri.</p>";
return;
}

let html="";

dataAlbum.forEach(album=>{
const fotoAlbum=dataFoto.filter(f=>f.album_id===album.id);

html+=`
<div class="item">
<h3>${aman(album.nama_album)}</h3>
<p><b>Kategori:</b> ${aman(album.kategori)}</p>
<p><b>Tanggal:</b> ${aman(album.tanggal_kegiatan||"-")}</p>
<p>${aman(album.deskripsi||"")}</p>
<p class="small">Jumlah foto: ${fotoAlbum.length}</p>
<div class="row">
<button class="gold" onclick="gantiNamaAlbum('${aman(album.id)}')">GANTI NAMA</button>
<button class="danger" onclick="hapusAlbumGaleri('${aman(album.id)}')">HAPUS ALBUM</button>
</div>
<div class="photo-grid">
`;

fotoAlbum.forEach(f=>{
const url=db.storage.from(BUCKET).getPublicUrl(f.foto_path).data.publicUrl;
html+=`
<div class="item">
<img src="${url}" alt="Foto galeri">
<button class="danger" onclick="hapusGaleri('${aman(f.id)}')">HAPUS FOTO</button>
</div>`;
});

html+="</div></div>";
});

const fotoLama=dataFoto.filter(f=>!f.album_id);
if(fotoLama.length){
html+=`<div class="item"><h3>Foto Lama / Belum Masuk Album</h3><div class="photo-grid">`;
fotoLama.forEach(f=>{
const url=db.storage.from(BUCKET).getPublicUrl(f.foto_path).data.publicUrl;
html+=`<div class="item">
<img src="${url}" alt="Foto lama">
<p>${aman(f.judul)}</p>
<button class="danger" onclick="hapusGaleri('${aman(f.id)}')">HAPUS FOTO</button>
</div>`;
});
html+="</div></div>";
}

tempat.innerHTML=html;
}

/* =========================
   GANTI NAMA ALBUM
========================= */

async function gantiNamaAlbum(id){
const album=dataAlbum.find(a=>a.id===id);
if(!album)return;

const nama=prompt("Nama album baru:",album.nama_album);
if(nama===null||!nama.trim())return;

const {error}=await db.from("Album_Galeri_Cemara")
.update({nama_album:nama.trim()}).eq("id",id);

if(error){alert("Gagal mengganti nama: "+error.message);return;}

await db.from("Galeri_Cemara")
.update({judul:nama.trim()}).eq("album_id",id);

alert("Nama album berhasil diperbarui.");
await muatPilihanAlbum();
await muatGaleriAdmin();
}

/* =========================
   HAPUS FOTO
========================= */

async function hapusGaleri(id){
if(!confirm("Yakin ingin menghapus foto ini?"))return;

const foto=dataFoto.find(f=>f.id===id);
if(!foto)return;

const {error}=await db.from("Galeri_Cemara").delete().eq("id",id);
if(error){alert("Gagal menghapus data foto: "+error.message);return;}

if(foto.foto_path){
const hapus=await db.storage.from(BUCKET).remove([foto.foto_path]);
if(hapus.error){
alert("Data foto terhapus, tetapi file Storage gagal dihapus: "+hapus.error.message);
}
}

await muatGaleriAdmin();
}

/* =========================
   HAPUS ALBUM
========================= */

async function hapusAlbumGaleri(id){
const album=dataAlbum.find(a=>a.id===id);
if(!album)return;

if(!confirm("Hapus album "+album.nama_album+" beserta seluruh fotonya?"))return;

const foto=dataFoto.filter(f=>f.album_id===id);
const paths=foto.map(f=>f.foto_path).filter(Boolean);

const hapusData=await db.from("Galeri_Cemara")
.delete().eq("album_id",id);

if(hapusData.error){
alert("Gagal menghapus foto album: "+hapusData.error.message);
return;
}

if(paths.length){
const hapusStorage=await db.storage.from(BUCKET).remove(paths);
if(hapusStorage.error){
alert("Data foto terhapus, tetapi sebagian file Storage mungkin masih tersimpan: "+hapusStorage.error.message);
}
}

const hapusAlbum=await db.from("Album_Galeri_Cemara")
.delete().eq("id",id);

if(hapusAlbum.error){
alert("Foto sudah dihapus, tetapi album gagal dihapus: "+hapusAlbum.error.message);
return;
}

alert("Album berhasil dihapus.");
await muatPilihanAlbum();
await muatGaleriAdmin();
}

/* =========================
   MULAI APLIKASI
========================= */

db.auth.onAuthStateChange((event,session)=>{
if(event==="SIGNED_OUT"){
document.getElementById("dashboard").classList.add("hidden");
document.getElementById("bagianLogin").classList.remove("hidden");
}
});

periksaLogin();
</script>
</body>
</html>
