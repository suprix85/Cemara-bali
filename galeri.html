<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#064e3b">
<title>Galeri CEMARA BALI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0fdf4;
  color:#064e3b;
}
header{
  background:linear-gradient(135deg,#064e3b,#047857);
  color:white;
  text-align:center;
  padding:28px 15px;
}
header h1{margin:0 0 8px}
header p{margin:0;color:#d9f99d}
.kembali{
  display:inline-block;
  margin-top:18px;
  padding:10px 18px;
  background:#a3e635;
  color:#064e3b;
  text-decoration:none;
  border-radius:25px;
  font-weight:bold;
}
.judul{
  text-align:center;
  padding:25px 12px 10px;
}
.judul h2{margin-bottom:8px}
#status{
  text-align:center;
  padding:15px;
  color:#047857;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:12px;
  padding:15px;
  max-width:1100px;
  margin:auto;
}
.foto{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:12px;
  cursor:pointer;
  background:#d1fae5;
  box-shadow:0 3px 10px #0002;
}
.foto:hover{opacity:.9}
#pembesar{
  display:none;
  position:fixed;
  inset:0;
  z-index:99;
  background:#000e;
  justify-content:center;
  align-items:center;
  padding:15px;
}
#pembesar img{
  max-width:100%;
  max-height:85vh;
  object-fit:contain;
  border-radius:8px;
}
#tutup{
  position:absolute;
  top:15px;
  right:20px;
  color:white;
  font-size:35px;
  cursor:pointer;
}
footer{
  text-align:center;
  padding:22px;
  color:#047857;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>GALERI CEMARA BALI</h1>
  <p>Cemara selalu dihati</p>
  <a class="kembali" href="index.html">← Kembali ke Beranda</a>
</header>

<div class="judul">
  <h2>Dokumentasi Kegiatan</h2>
  <p>Kenangan dan kebersamaan keluarga besar CEMARA BALI</p>
</div>

<div id="status">Memuat foto galeri...</div>
<div class="grid" id="daftar-foto"></div>

<div id="pembesar" onclick="tutupFoto()">
  <span id="tutup">&times;</span>
  <img id="foto-besar" src="" alt="Foto galeri">
</div>

<footer>
  © CEMARA BALI · Dibuat oleh Selamet Supriono
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://epyxdvxgcgxgsvrkpsid.supabase.co";
const SUPABASE_KEY = "sb_publishable_BrT9hySkfHZwBhCtYRRyUw_VZqpa1U9";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function muatGaleri(){
  const status = document.getElementById("status");
  const wadah = document.getElementById("daftar-foto");

  try{
    const {data,error} = await supabaseClient
      .storage
      .from("cemara-bali")
      .list("galeri",{
        limit:100,
        sortBy:{column:"created_at",order:"desc"}
      });

    if(error) throw error;

    const foto = (data || []).filter(file =>
      /\.(jpg|jpeg|png|webp)$/i.test(file.name)
    );

    if(foto.length === 0){
      status.textContent = "Belum ada foto di galeri.";
      return;
    }

    status.textContent = foto.length + " foto dokumentasi CEMARA BALI";

    foto.forEach(file=>{
      const {data:urlData} = supabaseClient
        .storage
        .from("cemara-bali")
        .getPublicUrl("galeri/" + file.name);

      const img = document.createElement("img");
      img.className = "foto";
      img.src = urlData.publicUrl;
      img.alt = "Dokumentasi CEMARA BALI";
      img.loading = "lazy";
      img.onclick = ()=>bukaFoto(img.src);

      wadah.appendChild(img);
    });

  }catch(error){
    console.error(error);
    status.textContent = "Foto belum dapat dimuat. Periksa izin akses galeri Supabase.";
  }
}

function bukaFoto(url){
  document.getElementById("foto-besar").src = url;
  document.getElementById("pembesar").style.display = "flex";
}

function tutupFoto(){
  document.getElementById("pembesar").style.display = "none";
}

muatGaleri();
</script>

</body>
</html>
